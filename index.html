<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛主席语录 · 每日一句</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 第一层：语录屏 -->
    <div id="quote-screen" class="screen active">
        <div class="particles" id="particles"></div>
        <div class="quote-container">
            <p id="quote-text" class="quote-text">加载中...</p>
            <p id="quote-source" class="quote-source"></p>
        </div>
        <div class="scroll-hint">
            <span class="scroll-arrow">↓</span>
            <span class="scroll-text">展开解析</span>
        </div>
    </div>

    <!-- 第二层：解析屏 -->
    <div id="analysis-screen" class="screen">
        <div class="analysis-content">
            <div class="quote-preview">
                <p id="analysis-quote" class="quote-text-small"></p>
                <p id="analysis-source" class="quote-source-small"></p>
            </div>
            <div class="analysis-sections">
                <div class="section">
                    <h3>释义</h3>
                    <p id="interpretation"></p>
                </div>
                <div class="section">
                    <h3>历史背景</h3>
                    <p id="context"></p>
                </div>
                <div class="section">
                    <h3>今日启示</h3>
                    <p id="insight"></p>
                </div>
            </div>
            <div class="streak-bar">
                <div class="streak-info">
                    <span class="streak-icon">🔥</span>
                    <span id="streak-text">开始学习 · 每日一句，持之以恒</span>
                </div>
                <div class="streak-actions">
                    <button id="history-btn" class="history-btn">查看历史 →</button>
                    <button id="mute-btn" class="mute-btn" title="开关音效">🔊</button>
                </div>
            </div>
            <div class="checkin-area">
                <button id="checkin-btn" class="checkin-btn">今日已学</button>
                <div id="share-options" class="share-options hidden">
                    <button id="share-image-btn" class="share-btn">生成分享卡片</button>
                    <button id="copy-text-btn" class="share-btn">复制文字</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 分享卡片 Canvas（隐藏） -->
    <canvas id="share-canvas" width="1080" height="1920" style="display:none;"></canvas>

    <script src="js/data.js"></script>
    <script src="js/share.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
